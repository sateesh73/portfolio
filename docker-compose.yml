services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: sateesh-portfolio:latest
    container_name: sateesh-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/contacts.db
    volumes:
      - portfolio_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  portfolio_data:
    driver: local
